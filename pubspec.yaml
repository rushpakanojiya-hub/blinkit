name: gofresh_customer
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  google_fonts: ^6.3.3
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  razorpay_flutter: ^1.4.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  printing: ^5.13.4
  open_filex: ^4.5.0
  carousel_slider: ^5.0.0
  media_store_plus: ^0.1.3
  file_picker: ^8.1.6
  permission_handler: ^11.3.1
  go_router: ^14.6.2
  dio: ^5.11.0

